<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" fill="none">
  <!--
    Derived by hand from svg/mark-small.svg and svg/mark-small-bone.svg — the
    same geometry, with the two cuts the designer supplied wired to a colour
    scheme query.

    A tab favicon is the one place the mark is drawn on a ground we neither
    choose nor know: the browser chrome. The navy figure on a dark tab strip is
    a navy figure on navy. SVG favicons honour prefers-color-scheme, so the
    bone cut is used there instead; the teal target is legible on both and does
    not move.

    The light cut is in presentation attributes and the <style> block only
    overrides it. Doing it the other way round — a CSS custom property for each
    colour — renders as a bare teal dot in anything that is not a browser:
    librsvg does not resolve var(), and link unfurlers, crawlers and
    thumbnailers all run something like it. Presentation attributes lose to CSS
    where CSS is understood, and are all that is left where it is not, so both
    audiences get a whole figure.

    mark-small rather than mark-full because this is rendered at 16-20px, and
    the brand rule is that the rings come off below 32px or the deltoid target
    fills in. See ../readme.md.

    Written out rather than copied so it carries no C2PA manifest: this file is
    fetched on every first paint, and the manifest is 8KB against 700 bytes of
    drawing. The signed originals stay in svg/.
  -->
  <style>
    @media (prefers-color-scheme: dark) {
      .fig-fill { fill: #EFE9DA; }
      .fig-stroke { stroke: #EFE9DA; }
      .halo { stroke: #1F2A44; }
    }
  </style>
  <circle class="fig-fill" cx="60" cy="19" r="10" fill="#1F2A44" />
  <path class="fig-fill" d="M38 36 H82 L77 74 H43 Z" fill="#1F2A44" />
  <path class="fig-stroke" d="M36 42 L26 80 M84 42 L94 80" stroke="#1F2A44" stroke-width="12" stroke-linecap="round" />
  <path class="fig-stroke" d="M50 78 L48 110 M70 78 L72 110" stroke="#1F2A44" stroke-width="13" stroke-linecap="round" />
  <circle class="halo" cx="85" cy="46" r="12" fill="#3F8F8A" stroke="#EFE9DA" stroke-width="5" />
</svg>
