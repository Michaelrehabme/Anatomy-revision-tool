# Deploy configuration, in the repo on purpose.
#
# The site previously had no netlify.toml, so the linked site's own setting
# governed — and it published the PROJECT ROOT rather than dist/. A plain
# `netlify deploy --prod` would have uploaded the whole checkout, node_modules
# included, and every deploy needed a hand-passed --dir to be correct.
#
# With this file the build is described by the repository: whoever deploys,
# from wherever, gets the same command and the same publish directory.

[build]
  command = "npm run build"
  publish = "dist"

# Server-side code: the Paddle webhook, and only that. Secrets live in the
# Netlify dashboard as environment variables and are never committed.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The renewal reminders UK law leaves to us — the monthly plan, whose period is
# under the six months that obliges Paddle to send them. 09:00 UTC daily: the
# rule only fires inside a seven-day window before a qualifying payment, so a
# missed day is recoverable, and a morning send reads as a reminder rather than
# something that went out overnight. See docs/DMCC-SUBSCRIPTIONS.md.
#
# Scheduled functions run only on published production deploys, never on branch
# deploys or previews, so this cannot fire twice from two environments.
[functions."renewal-reminders"]
  schedule = "0 9 * * *"

# SPA fallback. dist/_redirects (from public/) says the same thing; this is
# here so the rule survives a build that loses the public/ copy.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The public educator demo (CR-028) builds from THIS repository, and the block
# above would otherwise govern it: a netlify.toml overrides a site's own UI
# build settings, so a second site pointed at this repo would run
# `npm run build` and publish the real app — Firebase config and all — to the
# demo URL. That is the exact failure the demo build was designed to prevent.
#
# A branch context is the fix. [context.<branch>] is the most specific block
# Netlify has and overrides [build]. Point the demo site at a `demo` branch and
# it picks these up; every other site keeps the production settings.
#
# Redirects and headers are global in Netlify config and take no context, so
# the SPA fallback above already covers both sites.
[context.demo]
  command = "npm run build:demo"
  publish = "dist-demo"
