<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spaced-repetition anatomy revision for MSK students. 309 structures with verified origin, insertion, nerve supply and action, drilled until you can locate them."
    />
    <title>LocusMSK</title>
    <!--
      Fonts are self-hosted from public/fonts/ rather than loaded from the
      Google Fonts CDN (CR-023). The CDN request fails with no network and
      blocks first paint, which is the wrong failure for an app whose point is
      revising without signal; and requesting a font from fonts.gstatic.com
      sends the student's IP address to Google, which has been found an
      unlawful transfer under GDPR. Regenerate with src/scripts/fetchFonts.ts.

      Only the two faces used above the fold are preloaded — IBM Plex Sans for
      body text, Newsreader for headings. `crossorigin` is required on a font
      preload even same-origin; without it the browser fetches the file twice.
    -->
    <link rel="preload" href="/fonts/ibm-plex-sans-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/newsreader-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
