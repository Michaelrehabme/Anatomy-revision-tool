<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spaced-repetition anatomy revision for MSK students. 309 structures with verified origin, insertion, nerve supply and action, drilled until you can locate them."
    />
    <title>LocusMSK</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Ink navy: the browser chrome and Android status bar take the brand, not the page ground. -->
    <meta name="theme-color" content="#1f2a44" />
    <!-- SVG first for browsers that scale it themselves, and it is the only cut
         that follows the tab strip into dark mode — the navy figure is drawn on
         chrome we do not control. The PNGs are the fallback for browsers that
         will not take an SVG here, and cannot adapt. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <!-- iOS ignores the manifest icons and rounds the corners itself, so this is
         the full-bleed navy app icon with no alpha channel at all. See
         src/scripts/generateIcons.ts. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      Fonts are self-hosted from public/fonts/ rather than loaded from the
      Google Fonts CDN (CR-023). The CDN request fails with no network and
      blocks first paint, which is the wrong failure for an app whose point is
      revising without signal; and requesting a font from fonts.gstatic.com
      sends the student's IP address to Google, which has been found an
      unlawful transfer under GDPR. Regenerate with src/scripts/fetchFonts.ts.

      One preload, because the whole product is now one family and Source Serif
      4 is variable — the single latin file covers 400 and 600. `crossorigin` is
      required on a font preload even same-origin; without it the browser
      fetches the file twice.
    -->
    <link rel="preload" href="/fonts/source-serif-4-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
