<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Spaced-repetition anatomy revision for MSK students. 486 structures, with origin, insertion, nerve supply and action for every muscle, cross-referenced against Terminologia Anatomica, drilled until you can locate them."
    />
    <title>LocusMSK: anatomy revision for MSK students</title>
    <!--
      What a link to the site looks like when it is pasted into a chat or a
      post. Read by crawlers that run no script, so it lives here and not in a
      component, and the addresses are absolute because most of them will not
      resolve a relative one. One card for every route: the app is a single
      page, and the routes worth sharing are the home page and the prices.
      public/share.jpg is 1200 x 630 and under 100 kB; WhatsApp drops a
      preview image much larger than that.
    -->
    <link rel="canonical" href="https://locusmsk.co.uk/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LocusMSK" />
    <meta property="og:url" content="https://locusmsk.co.uk/" />
    <meta property="og:title" content="LocusMSK: find it, name it, remember it" />
    <meta
      property="og:description"
      content="Anatomy revision for physiotherapy, sports rehab and MSK students. 486 structures across nine regions, on real 3D renders, with spaced repetition. One region free."
    />
    <meta property="og:image" content="https://locusmsk.co.uk/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LocusMSK. A 3D render of the shoulder from behind with the deltoid highlighted." />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Theme bootstrap. Runs before first paint, so a dark-mode student never
      sees a flash of paper on the way in. It cannot import
      src/features/anatomy-revision/lib/theme.ts — a module is deferred, and
      deferred means the light palette paints first — so the two storage keys
      are duplicated here ON PURPOSE. lib/__tests__/theme.test.ts reads this
      file and asserts the strings still match, so the duplication cannot rot.
    -->
    <script>
      (function () {
        try {
          var el = document.documentElement;
          var theme = localStorage.getItem('anatomy-revision:v1:theme');
          var contrast = localStorage.getItem('anatomy-revision:v1:contrast');
          // Anything that is not an explicit override follows the device:
          // null, 'system', and any stale or hand-edited value alike.
          var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var high =
            contrast === 'high' || (contrast !== 'normal' && matchMedia('(prefers-contrast: more)').matches);
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
          el.setAttribute('data-contrast', high ? 'high' : 'normal');
        } catch (e) {
          /* Private browsing with storage blocked: light, which is what :root gives anyway. */
        }
      })();
    </script>
    <!-- Ink navy: the browser chrome and Android status bar take the brand, not
         the page ground. Media-scoped, so they follow the DEVICE; anyone who
         overrode the theme gets an unscoped meta written by ThemeProvider,
         which beats both. -->
    <meta name="theme-color" content="#1f2a44" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121927" media="(prefers-color-scheme: dark)" />
    <!-- SVG first for browsers that scale it themselves, and it is the only cut
         that follows the tab strip into dark mode — the navy figure is drawn on
         chrome we do not control. The PNGs are the fallback for browsers that
         will not take an SVG here, and cannot adapt. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icons/favicon-16.png" sizes="16x16" type="image/png" />
    <!-- iOS ignores the manifest icons and rounds the corners itself, so this is
         the full-bleed navy app icon with no alpha channel at all. See
         src/scripts/generateIcons.ts. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!--
      Fonts are self-hosted from public/fonts/ rather than loaded from the
      Google Fonts CDN (CR-023). The CDN request fails with no network and
      blocks first paint, which is the wrong failure for an app whose point is
      revising without signal; and requesting a font from fonts.gstatic.com
      sends the student's IP address to Google, which has been found an
      unlawful transfer under GDPR. Regenerate with src/scripts/fetchFonts.ts.

      Two preloads, one per family, and both are variable — each latin file
      covers its whole weight range, so there is nothing per-weight to add. Only
      the latin cuts: latin-ext carries the accents that a handful of eponyms
      need and is not worth blocking first paint for. The italic is not
      preloaded either; it is one line under a structure name, well below the
      fold. `crossorigin` is required on a font preload even same-origin;
      without it the browser fetches the file twice.

      These two filenames are the only place a generated font file is named by
      hand. fetchFonts.ts deliberately names any multi-weight file 'variable'
      rather than after its range, so adding or dropping a weight cannot
      silently break these two lines.
    -->
    <link rel="preload" href="/fonts/hanken-grotesk-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bricolage-grotesque-variable-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
