<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" fill="none" role="img" aria-label="LocusMSK">
  <!--
    The maskable variant, for Android adaptive icons and anywhere else the
    launcher crops the icon to its own shape.

    Two differences from locusmsk-mark.svg, both required rather than stylistic:
    a full-bleed bone background, because a transparent maskable icon is
    rendered on whatever the launcher chooses and the navy figure can land on
    navy; and the mark scaled to sit inside the 80% safe zone, since a circular
    or squircle mask cuts the corners off. Content here occupies ~62%, which
    keeps the ring clear of the crop on every mask shape Android uses.
  -->
  <rect width="128" height="128" fill="#EFE9DA" />
  <g transform="translate(24.0,25.2) scale(0.744)">
    <circle cx="85" cy="46" r="22" stroke="#3F8F8A" stroke-width="3.5" opacity="0.45" />
    <circle cx="60" cy="19" r="10" fill="#1F2A44" />
    <path d="M38 36 H82 L77 74 H43 Z" fill="#1F2A44" />
    <path d="M36 42 L26 80 M84 42 L94 80" stroke="#1F2A44" stroke-width="12" stroke-linecap="round" />
    <path d="M50 78 L48 110 M70 78 L72 110" stroke="#1F2A44" stroke-width="13" stroke-linecap="round" />
    <circle cx="85" cy="46" r="9" fill="#3F8F8A" stroke="#EFE9DA" stroke-width="3.5" />
  </g>
</svg>
